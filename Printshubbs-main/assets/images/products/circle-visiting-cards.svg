<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Soft Warm Backdrop -->
    <linearGradient id="circBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f3ede2"/>
    </linearGradient>
    <!-- Round Wooden Platter -->
    <linearGradient id="platterWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b08968"/>
      <stop offset="50%" stop-color="#9c6644"/>
      <stop offset="100%" stop-color="#7f4f24"/>
    </linearGradient>
    <filter id="circShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#451a03" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#circBg)"/>

  <!-- Round Turned Wood Dish (Center) -->
  <g transform="translate(185, 150)" filter="url(#circShadow)">
    <circle cx="0" cy="0" r="115" fill="url(#platterWood)"/>
    <circle cx="0" cy="0" r="105" fill="#a07855"/>
    <circle cx="0" cy="0" r="95" fill="#8c6443"/>
  </g>

  <!-- Stack of Circle Cards Peeking Behind (Matching Screenshot 5) -->
  <g transform="translate(145, 115)" filter="url(#circShadow)">
    <circle cx="0" cy="0" r="54" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
    <text x="0" y="-8" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="8" fill="#be123c" text-anchor="middle">RUBY CRAFTS</text>
    <line x1="-25" y1="2" x2="25" y2="2" stroke="#fecdd3" stroke-width="0.75"/>
    <text x="0" y="12" font-family="-apple-system, sans-serif" font-size="5" fill="#64748b" text-anchor="middle">HANDMADE CANDLES</text>
  </g>

  <!-- Main Circle Visiting Card (Foreground Right) -->
  <g transform="translate(205, 160)" filter="url(#circShadow)">
    <!-- 6.5 cm Precision Die-cut Circle Base -->
    <circle cx="0" cy="0" r="58" fill="#ffffff"/>
    <circle cx="0" cy="0" r="57" fill="none" stroke="#cbd5e1" stroke-width="0.75"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#be123c" stroke-width="0.75" stroke-dasharray="2,2"/>

    <!-- Perfume / Scent Icon -->
    <g transform="translate(0, -18)">
      <rect x="-6" y="-8" width="12" height="6" rx="1" fill="#be123c"/>
      <rect x="-10" y="-2" width="20" height="18" rx="3" fill="#be123c"/>
      <circle cx="0" cy="7" r="4" fill="#ffffff"/>
    </g>

    <text x="0" y="14" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="8.5" fill="#0f172a" letter-spacing="1" text-anchor="middle">EUXESCENTIS</text>
    <text x="0" y="24" font-family="-apple-system, sans-serif" font-weight="600" font-size="5" fill="#be123c" letter-spacing="1.5" text-anchor="middle">ORGANIC PERFUMERY</text>
    <text x="0" y="34" font-family="-apple-system, sans-serif" font-size="4.5" fill="#64748b" text-anchor="middle">euxescentis.com • Mumbai</text>
  </g>
</svg>
