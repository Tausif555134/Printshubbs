<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Dark Textured Slate Stone Background -->
    <linearGradient id="slateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Pearl Mineral Shimmer Texture -->
    <linearGradient id="pearlShimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef3c7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#ecfeff" stop-opacity="0.5"/>
      <stop offset="75%" stop-color="#fae8ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Luxury Gold Pen Material -->
    <linearGradient id="penGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="80%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="penShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark Slate Background -->
  <rect width="400" height="300" fill="url(#slateBg)"/>
  <!-- Slate Fractures & Texture -->
  <path d="M 0 100 Q 150 90 400 110" stroke="#475569" stroke-width="0.75" fill="none" opacity="0.4"/>
  <path d="M 0 220 Q 250 200 400 230" stroke="#475569" stroke-width="0.75" fill="none" opacity="0.4"/>

  <!-- Card 1 Stacked (Angled Left) -->
  <g transform="translate(70, 48) rotate(-10)" filter="url(#penShadow)">
    <rect width="210" height="125" rx="4" fill="#f8fafc"/>
    <rect width="210" height="125" rx="4" fill="url(#pearlShimmer)"/>
    <text x="25" y="45" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="10" fill="#0f172a">Kavita Verma</text>
    <text x="25" y="55" font-family="-apple-system, sans-serif" font-size="6" fill="#64748b">Senior Wealth Advisor</text>
  </g>

  <!-- Card 2 (Elite Finance with Fresh Green & Orange Bands) -->
  <g transform="translate(95, 85) rotate(-2)" filter="url(#penShadow)">
    <!-- Base Pearl Shimmer Card -->
    <rect width="220" height="130" rx="4" fill="#ffffff"/>
    <rect width="220" height="130" rx="4" fill="url(#pearlShimmer)"/>
    <rect width="220" height="130" rx="4" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>

    <!-- Left Color Block: Sage Green with White Icon -->
    <g transform="translate(25, 45)">
      <rect width="32" height="32" rx="4" fill="#15803d"/>
      <path d="M 8 16 L 16 8 L 24 16 L 16 24 Z" fill="#ffffff"/>
    </g>

    <!-- Center Color Block: Gold/Orange with Cap Icon -->
    <g transform="translate(62, 45)">
      <rect width="32" height="32" rx="4" fill="#ea580c"/>
      <circle cx="16" cy="16" r="6" fill="#ffffff"/>
    </g>

    <!-- Right Color Block: Teal with House Icon -->
    <g transform="translate(99, 45)">
      <rect width="32" height="32" rx="4" fill="#0d9488"/>
      <polygon points="16,8 6,18 26,18" fill="#ffffff"/>
      <rect x="11" y="18" width="10" height="6" fill="#ffffff"/>
    </g>

    <!-- Brand Typography -->
    <text x="25" y="102" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="11" fill="#0f172a" letter-spacing="2">ELITE FINANCE</text>
    <text x="25" y="112" font-family="-apple-system, sans-serif" font-weight="500" font-size="6" fill="#64748b">WEALTH MANAGEMENT &amp; EQUITIES</text>

    <!-- Pearl Luster Sheen Sweep -->
    <polygon points="0,0 70,0 20,130 0,130" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Luxury Executive Gold Fountain Pen (Diagonal Right, Foreground) -->
  <g transform="translate(260, 240) rotate(-48)" filter="url(#penShadow)">
    <!-- Pen Barrel -->
    <rect x="-8" y="-120" width="16" height="140" rx="6" fill="url(#penGold)"/>
    <!-- Gold Clip -->
    <rect x="-3" y="-105" width="6" height="65" rx="3" fill="#ca8a04"/>
    <circle cx="0" cy="-42" r="4" fill="#ca8a04"/>
    <!-- Black Grip Ring -->
    <rect x="-8" y="20" width="16" height="10" fill="#0f172a"/>
    <!-- Gold Band Trim -->
    <rect x="-8" y="18" width="16" height="2" fill="#fef08a"/>
    <rect x="-8" y="30" width="16" height="2" fill="#fef08a"/>
    <!-- Nib Base -->
    <polygon points="-6,32 6,32 0,55" fill="url(#penGold)"/>
    <polygon points="-2,32 2,32 0,55" fill="#fef9c3"/>
  </g>
</svg>
