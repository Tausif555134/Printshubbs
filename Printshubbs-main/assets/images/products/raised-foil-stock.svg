<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Background Surface with Soft Floral Ambiance -->
    <linearGradient id="bgFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6e8"/>
      <stop offset="40%" stop-color="#e8d5d8"/>
      <stop offset="100%" stop-color="#cfb8bd"/>
    </linearGradient>
    <!-- Genuine Metallic Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#fef9c3"/>
      <stop offset="75%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="cardShadowDeep" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="5" dy="14" stdDeviation="11" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Light Tabletop -->
  <rect width="400" height="300" fill="url(#bgFoil)"/>

  <!-- Glass Vase with Soft Pink/White Petals (Background Top Right) -->
  <g transform="translate(300, 20)" opacity="0.75">
    <ellipse cx="40" cy="80" rx="30" ry="10" fill="#a8a29e" opacity="0.2"/>
    <!-- Glass Bottle Silhouette -->
    <path d="M 30 20 L 50 20 L 52 40 Q 65 55 60 75 Q 40 85 20 75 Q 15 55 28 40 Z" fill="#ffffff" opacity="0.6" stroke="#e7e5e4" stroke-width="0.75"/>
    <path d="M 35 25 L 35 5" stroke="#15803d" stroke-width="1.5"/>
    <path d="M 45 25 L 55 0" stroke="#15803d" stroke-width="1.5"/>
    <circle cx="35" cy="2" r="9" fill="#fbcfe8" opacity="0.9"/>
    <circle cx="56" cy="-2" r="8" fill="#f472b6" opacity="0.9"/>
    <circle cx="20" cy="5" r="7" fill="#fdf2f8" opacity="0.9"/>
  </g>

  <!-- Stacked Lower Charcoal Card -->
  <g transform="translate(85, 75) rotate(-16)">
    <rect width="235" height="140" rx="5" fill="#18181b"/>
  </g>

  <!-- Main Luxury Velvet Black Card with Metallic Gold Foil Stamping -->
  <g transform="translate(80, 68) rotate(-16)" filter="url(#cardShadowDeep)">
    <!-- Charcoal Velvet Base -->
    <rect width="235" height="140" rx="5" fill="#09090b"/>
    <rect width="235" height="140" rx="5" fill="#18181b" opacity="0.3"/>

    <!-- Gleaming Gold Foil Script 'Maya Maya' (Matching exact cursive in screenshot) -->
    <g transform="translate(40, 60)">
      <!-- Subtle 3D Emboss Under-glow -->
      <text x="2" y="32" font-family="'Great Vibes', 'Allura', 'Brush Script MT', cursive" font-size="42" fill="#78350f" opacity="0.7">Maya</text>
      <!-- Metallic Gold Gradient Body -->
      <text x="0" y="30" font-family="'Great Vibes', 'Allura', 'Brush Script MT', cursive" font-size="42" fill="url(#goldFoil)">Maya</text>
      <!-- Gold Sparkle Accent -->
      <polygon points="105,10 108,10 106.5,15" fill="#ffffff"/>
      <polygon points="106.5,8 106.5,14 109,11" fill="#ffffff"/>
    </g>

    <g transform="translate(100, 95)">
      <text x="2" y="32" font-family="'Great Vibes', 'Allura', 'Brush Script MT', cursive" font-size="40" fill="#78350f" opacity="0.7">Maya</text>
      <text x="0" y="30" font-family="'Great Vibes', 'Allura', 'Brush Script MT', cursive" font-size="40" fill="url(#goldFoil)">Maya</text>
    </g>

    <!-- Thin Gold Border Trim Accent -->
    <rect x="10" y="10" width="215" height="120" rx="3" fill="none" stroke="url(#goldFoil)" stroke-width="0.6" opacity="0.4"/>
  </g>
</svg>
