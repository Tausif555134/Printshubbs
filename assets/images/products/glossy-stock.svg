<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Marble Surface Texture -->
    <linearGradient id="marble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="potShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Marble Tabletop -->
  <rect width="400" height="300" fill="url(#marble)"/>
  <!-- Subtle marble veining -->
  <path d="M-20 60 Q 80 120 180 80 T 380 140" stroke="#cbd5e1" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M40 0 Q 140 160 220 180 T 420 220" stroke="#cbd5e1" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M120 240 Q 220 200 320 280" stroke="#cbd5e1" stroke-width="1.2" fill="none" opacity="0.5"/>

  <!-- Succulent Plant in White Pot (Upper Right, matching screenshot) -->
  <g transform="translate(300, 30)">
    <ellipse cx="40" cy="72" rx="36" ry="12" fill="#000000" opacity="0.08" filter="blur(4px)"/>
    <!-- Ceramic Pot -->
    <path d="M 12 35 L 20 70 Q 40 76 60 70 L 68 35 Z" fill="#ffffff" filter="url(#potShadow)"/>
    <ellipse cx="40" cy="35" rx="28" ry="8" fill="#e2e8f0"/>
    <ellipse cx="40" cy="36" rx="25" ry="6" fill="#334155"/>
    <!-- Succulent Leaves -->
    <path d="M 40 36 C 30 20 20 25 32 36 Z" fill="#15803d"/>
    <path d="M 40 36 C 50 18 60 24 48 36 Z" fill="#16a34a"/>
    <path d="M 40 36 C 25 35 22 45 36 38 Z" fill="#22c55e"/>
    <path d="M 40 36 C 55 34 58 45 44 38 Z" fill="#15803d"/>
    <path d="M 40 36 C 38 12 42 12 40 36 Z" fill="#4ade80"/>
  </g>

  <!-- Brass Paperweight / Accent (Far Right) -->
  <circle cx="370" cy="115" r="16" fill="#d97706" opacity="0.75" filter="drop-shadow(2px 5px 4px rgba(0,0,0,0.15))"/>
  <circle cx="370" cy="115" r="11" fill="#f59e0b"/>

  <!-- Stack of Glossy Business Cards (Underneath) -->
  <g transform="translate(70, 75) rotate(-22)">
    <rect x="-2" y="6" width="220" height="130" rx="6" fill="#1e293b" opacity="0.5"/>
    <rect x="-1" y="3" width="220" height="130" rx="6" fill="#0f172a" opacity="0.8"/>
  </g>

  <!-- Main Top Glossy Card (Dark Navy Blue with Sharp Gloss Glare) -->
  <g transform="translate(68, 70) rotate(-22)" filter="url(#shadow)">
    <!-- Card Body -->
    <rect width="220" height="130" rx="6" fill="#1e293b"/>
    <rect width="220" height="130" rx="6" fill="url(#marble)" opacity="0.05"/>

    <!-- Subtle Geometric Grid / Monogram on Card -->
    <g transform="translate(26, 40)">
      <polygon points="0,0 24,0 36,36 12,36" fill="#f8fafc" opacity="0.9"/>
      <polygon points="26,0 42,0 30,36 14,36" fill="#38bdf8"/>
    </g>

    <!-- Card Brand Typography -->
    <text x="75" y="58" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="800" font-size="14" fill="#ffffff" letter-spacing="1.5">EIGHT ONE</text>
    <text x="75" y="72" font-family="-apple-system, sans-serif" font-weight="500" font-size="8" fill="#94a3b8" letter-spacing="2">DEVELOPMENT</text>

    <!-- Cardholder Contact Lines -->
    <text x="26" y="105" font-family="-apple-system, sans-serif" font-weight="600" font-size="7.5" fill="#f1f5f9">Ananda Chatterji</text>
    <text x="26" y="115" font-family="-apple-system, sans-serif" font-size="6" fill="#64748b">Senior Principal Architect • +91 98201 44521</text>

    <!-- Mirror Gloss Reflection Gradient Layer across card face -->
    <rect width="220" height="130" rx="6" fill="url(#glare)"/>
    <!-- Specular highlight streak -->
    <polygon points="0,0 80,0 20,130 0,130" fill="#ffffff" opacity="0.25"/>
    <!-- Thin glossy border shine -->
    <rect width="220" height="130" rx="6" fill="none" stroke="#ffffff" stroke-width="0.75" opacity="0.4"/>
  </g>
</svg>
