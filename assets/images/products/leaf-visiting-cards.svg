<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Floral Lavender Background -->
    <linearGradient id="floralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <filter id="leafShadow" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="3" dy="10" stdDeviation="8" flood-color="#4c1d95" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#floralBg)"/>

  <!-- Dried Florals & Lavender sprigs around borders (Matching Screenshot 5) -->
  <g transform="translate(20, 20)" opacity="0.7">
    <circle cx="10" cy="15" r="4" fill="#a855f7"/>
    <circle cx="22" cy="10" r="3.5" fill="#c084fc"/>
    <circle cx="18" cy="25" r="4.5" fill="#e9d5ff"/>
    <circle cx="32" cy="18" r="3" fill="#fbbf24"/>
  </g>
  <g transform="translate(320, 210)" opacity="0.7">
    <circle cx="20" cy="15" r="5" fill="#facc15"/>
    <circle cx="35" cy="25" r="4" fill="#fde047"/>
    <circle cx="48" cy="18" r="5" fill="#a855f7"/>
  </g>

  <!-- Leaf Die-cut Silhouette Cards (Rounded opposite corners, square opposite corners) -->
  <g transform="translate(90, 70) rotate(-12)" filter="url(#leafShadow)">
    <!-- Leaf Silhouette: Top-Left rounded (45px), Bottom-Right rounded (45px), others 0 -->
    <path d="M 45 0 L 220 0 Q 220 0 220 0 L 220 85 Q 220 130 175 130 L 0 130 Q 0 130 0 130 L 0 45 Q 0 0 45 0 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.75"/>
    <!-- Earthy Beige Graphic Area -->
    <path d="M 45 0 L 110 0 Q 90 70 0 90 L 0 45 Q 0 0 45 0 Z" fill="#d6ccc2"/>

    <text x="125" y="48" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="12" fill="#2d3748">Botanica</text>
    <text x="125" y="60" font-family="-apple-system, sans-serif" font-size="6.5" fill="#64748b" letter-spacing="1">NATURAL FLORALS</text>
    <text x="125" y="80" font-family="-apple-system, sans-serif" font-size="6" fill="#0f172a">Aria Fernandes • Founder</text>
    <text x="125" y="90" font-family="-apple-system, sans-serif" font-size="5.5" fill="#64748b">+91 99881 22334</text>
  </g>

  <!-- Second Leaf Card in Perspective Behind -->
  <g transform="translate(140, 110) rotate(16)" filter="url(#leafShadow)">
    <path d="M 45 0 L 220 0 Q 220 0 220 0 L 220 85 Q 220 130 175 130 L 0 130 Q 0 130 0 130 L 0 45 Q 0 0 45 0 Z" fill="#fdfbf7" stroke="#e5e5e5" stroke-width="0.5"/>
    <circle cx="110" cy="65" r="22" fill="#e3d5ca" opacity="0.6"/>
    <text x="110" y="69" font-family="'Caveat', cursive" font-size="14" font-weight="700" fill="#44403c" text-anchor="middle">Petals &amp; Co.</text>
  </g>
</svg>
