<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- White Refrigerator Metal Surface -->
    <linearGradient id="fridgeSurface" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="magnetShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#334155" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Refrigerator Door Surface -->
  <rect width="400" height="300" fill="url(#fridgeSurface)"/>

  <!-- Left Refrigerator Door Handle / Recess Line (Matching screenshot) -->
  <rect x="18" y="0" width="14" height="300" fill="#f1f5f9"/>
  <line x1="18" y1="0" x2="18" y2="300" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="32" y1="0" x2="32" y2="300" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="22" y="70" width="6" height="160" rx="3" fill="#cbd5e1" opacity="0.6"/>

  <!-- Top Magnetic Card: Vintage Tan Pizzeria Card (Matching screenshot) -->
  <g transform="translate(90, 48)" filter="url(#magnetShadow)">
    <rect width="210" height="95" rx="5" fill="#e2d9c2"/>
    <!-- Subtle darker magnetic back edge peek -->
    <rect x="1" y="94" width="208" height="2" fill="#1e293b"/>

    <!-- Decorative Mandala / Pizza Slice Flourish on Left -->
    <g transform="translate(42, 48)" opacity="0.55">
      <circle cx="0" cy="0" r="26" fill="none" stroke="#78350f" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="0" cy="0" r="18" fill="none" stroke="#78350f" stroke-width="1"/>
      <polygon points="0,-16 14,8 -14,8" fill="#78350f" opacity="0.3"/>
      <circle cx="0" cy="0" r="5" fill="#78350f"/>
    </g>

    <text x="110" y="44" font-family="'Cinzel', 'Playfair Display', serif" font-weight="700" font-size="14" fill="#451a03">Pizzeria</text>
    <text x="110" y="58" font-family="-apple-system, sans-serif" font-size="7" fill="#78350f" letter-spacing="1">AUTHENTIC WOOD-FIRED</text>
    <text x="110" y="74" font-family="-apple-system, sans-serif" font-size="6.5" fill="#451a03">Call for Delivery: 1800 209 8899</text>
  </g>

  <!-- Bottom Magnetic Card: Vibrant Red 'Creative Studio' Card (Matching screenshot) -->
  <g transform="translate(90, 160)" filter="url(#magnetShadow)">
    <!-- Card Front -->
    <rect width="210" height="95" rx="5" fill="#dc2626"/>
    <!-- Magnetic Dark Backing Layer Peeking -->
    <rect x="1" y="94" width="208" height="2" fill="#0f172a"/>

    <!-- Geometric Creative Studio Emblem -->
    <g transform="translate(45, 48)">
      <circle cx="0" cy="0" r="20" fill="#ffffff" opacity="0.2"/>
      <path d="M -8 -10 L 10 0 L -8 10 Z" fill="#ffffff"/>
      <circle cx="8" cy="8" r="4" fill="#fef08a"/>
    </g>

    <text x="95" y="42" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="12" fill="#ffffff">Creative Studio</text>
    <text x="95" y="55" font-family="-apple-system, sans-serif" font-weight="500" font-size="6.5" fill="#fee2e2" letter-spacing="1">BRANDING &amp; PACKAGING</text>
    <text x="95" y="74" font-family="-apple-system, sans-serif" font-size="6" fill="#fecaca">hello@creativestudio.in • +91 99880 11223</text>
  </g>
</svg>
