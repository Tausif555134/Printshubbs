<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Dark Wood Grain Surface -->
    <linearGradient id="darkWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#291811"/>
      <stop offset="50%" stop-color="#1e100a"/>
      <stop offset="100%" stop-color="#140a06"/>
    </linearGradient>
    <!-- Sage Green Card Texture -->
    <linearGradient id="sageCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84a98c"/>
      <stop offset="100%" stop-color="#6b9080"/>
    </linearGradient>
    <!-- Spot UV Raised Gloss Shimmer -->
    <linearGradient id="uvGloss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="card3D" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="9" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark Textured Wood Tabletop -->
  <rect width="400" height="300" fill="url(#darkWood)"/>
  <path d="M0 60 Q 200 65 400 58" stroke="#3d2419" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M0 160 Q 180 155 400 164" stroke="#3d2419" stroke-width="1.5" fill="none" opacity="0.6"/>
  <path d="M0 240 Q 220 246 400 238" stroke="#3d2419" stroke-width="1.5" fill="none" opacity="0.6"/>

  <!-- Lower Card Layer (Stack Depth) -->
  <g transform="translate(95, 68) rotate(-14)">
    <rect x="-4" y="6" width="230" height="140" rx="4" fill="#4d6a5c"/>
  </g>

  <!-- Main Sage Green Spot UV Card -->
  <g transform="translate(90, 60) rotate(-14)" filter="url(#card3D)">
    <rect width="230" height="140" rx="4" fill="url(#sageCard)"/>
    <rect width="230" height="140" rx="4" fill="none" stroke="#52796f" stroke-width="0.75"/>

    <!-- Subtle Matte Paper Fibers -->
    <line x1="20" y1="35" x2="100" y2="35" stroke="#4d6a5c" stroke-width="0.5" opacity="0.5"/>

    <!-- Left Text Content -->
    <text x="25" y="55" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="11" fill="#2d3748" letter-spacing="1">Lonar Premier</text>
    <text x="25" y="68" font-family="-apple-system, sans-serif" font-weight="500" font-size="6.5" fill="#334155" letter-spacing="1.5">BOUTIQUE HOTELS &amp; SUITES</text>

    <!-- Raised 3D Spot UV Embossed Monogram 'LP' (With Specular Light Highlight) -->
    <g transform="translate(145, 65)">
      <!-- Drop Shadow for raised UV gel feeling -->
      <text x="1" y="46" font-family="'Cinzel', 'Playfair Display', serif" font-weight="800" font-size="44" fill="#1b2a22" opacity="0.6">LP</text>
      <!-- Deep glossy color -->
      <text x="0" y="44" font-family="'Cinzel', 'Playfair Display', serif" font-weight="800" font-size="44" fill="#1f3d2b">LP</text>
      <!-- Raised clear high-gloss shine layer -->
      <text x="0" y="44" font-family="'Cinzel', 'Playfair Display', serif" font-weight="800" font-size="44" fill="url(#uvGloss)" opacity="0.75">LP</text>
      <!-- Glint sparkle -->
      <polygon points="12,18 16,18 14,24" fill="#ffffff"/>
      <polygon points="14,16 14,22 17,19" fill="#ffffff"/>
    </g>

    <text x="25" y="112" font-family="-apple-system, sans-serif" font-size="6" fill="#334155">Harish K. Varma • Managing Partner</text>
    <text x="25" y="122" font-family="-apple-system, sans-serif" font-size="5.5" fill="#475569">+91 22 2844 9100 • info@lonarpremier.com</text>
  </g>
</svg>
