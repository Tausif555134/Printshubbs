<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Warm Aesthetic Beige Background -->
    <linearGradient id="velvetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#f3ede2"/>
    </linearGradient>
    <!-- Fluted Natural Wood Tray -->
    <linearGradient id="trayWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6cca9"/>
      <stop offset="50%" stop-color="#d4b483"/>
      <stop offset="100%" stop-color="#c19a6b"/>
    </linearGradient>
    <!-- Velvet Touch Soft Pastel Purple -->
    <linearGradient id="velvetPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="trayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="16" stdDeviation="12" flood-color="#78350f" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#velvetBg)"/>

  <!-- Dried Palm Leaves in Background (Top Left) -->
  <g transform="translate(40, -10)" opacity="0.6">
    <path d="M 0 0 Q 60 80 120 140" stroke="#b45309" stroke-width="2" fill="none"/>
    <path d="M 20 20 L 5 40 M 35 35 L 15 65 M 55 55 L 30 90 M 75 75 L 50 115 M 95 95 L 70 140" stroke="#d97706" stroke-width="1.5"/>
  </g>

  <!-- Circular Fluted Wooden Tray (Center) -->
  <g transform="translate(200, 155)" filter="url(#trayShadow)">
    <circle cx="0" cy="0" r="125" fill="url(#trayWood)"/>
    <circle cx="0" cy="0" r="118" fill="#e6cca9" stroke="#b45309" stroke-width="0.5" opacity="0.4"/>
    <!-- Fluted radiating rim rings -->
    <circle cx="0" cy="0" r="112" fill="#d4b483" opacity="0.3"/>
  </g>

  <!-- Bottom Card 1: Purple Velvet Touch Card (Angled Left) -->
  <g transform="translate(100, 95) rotate(-22)" filter="url(#trayShadow)">
    <rect width="180" height="110" rx="5" fill="url(#velvetPurple)"/>
    <rect width="180" height="110" rx="5" fill="#ffffff" opacity="0.06"/> <!-- Peach fuzz matte feel -->

    <!-- Imperial Furnitures Line Art Logo -->
    <g transform="translate(25, 45)" stroke="#ffffff" stroke-width="1" fill="none">
      <rect x="0" y="0" width="16" height="24" rx="2"/>
      <rect x="10" y="8" width="16" height="24" rx="2"/>
    </g>

    <text x="60" y="52" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="9" fill="#ffffff" letter-spacing="1">IMPERIAL</text>
    <text x="60" y="62" font-family="-apple-system, sans-serif" font-weight="500" font-size="6.5" fill="#e0e7ff" letter-spacing="1.5">FURNITURES</text>
    <text x="60" y="74" font-family="-apple-system, sans-serif" font-size="5" fill="#c7d2fe">Handcrafted Solid Teak</text>
  </g>

  <!-- Top Card 2: Purple Velvet Touch Card (Angled Right, Foreground) -->
  <g transform="translate(165, 125) rotate(14)" filter="url(#trayShadow)">
    <!-- 450 GSM Heavy Velvet Base -->
    <rect width="185" height="112" rx="5" fill="#4f46e5"/>
    <rect width="185" height="112" rx="5" fill="#ffffff" opacity="0.08"/>

    <!-- Geometric Chair / Architecture Vector Motif -->
    <g transform="translate(30, 48)" stroke="#ffffff" stroke-width="1.2" fill="none">
      <polygon points="0,20 12,0 24,20"/>
      <line x1="4" y1="20" x2="4" y2="30"/>
      <line x1="20" y1="20" x2="20" y2="30"/>
    </g>

    <text x="68" y="54" font-family="'Space Grotesk', -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#ffffff" letter-spacing="1">IMPERIAL</text>
    <text x="68" y="65" font-family="-apple-system, sans-serif" font-weight="500" font-size="7" fill="#e0e7ff" letter-spacing="1.5">FURNITURES</text>
    <text x="30" y="94" font-family="-apple-system, sans-serif" font-size="5.5" fill="#c7d2fe">Bespoke Living • Mumbai | Bengaluru</text>
  </g>
</svg>
